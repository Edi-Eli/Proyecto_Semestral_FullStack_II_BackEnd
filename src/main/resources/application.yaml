server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: ferreteria-maestros-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ferreteria_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: ferreteria-pool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# ---------------------------------------------------------------------
# Configuración propia de la aplicación
# ---------------------------------------------------------------------
app:
  jwt:
    secret: ${JWT_SECRET:clave-super-secreta-local-solo-para-desarrollo-32b}
    expiration-ms: ${JWT_EXPIRATION_MS:7200000}
    issuer: ${JWT_ISSUER:ferreteria-maestros}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ---------------------------------------------------------------------
# Documentación de la API (Swagger UI)
# ---------------------------------------------------------------------
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

# ---------------------------------------------------------------------
# Actuator (health check requerido por Render)
# ---------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
