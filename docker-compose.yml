services:
  postgres:
    image: postgres:16-alpine
    container_name: ferreteria-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ferreteria_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ferreteria-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ferreteria_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ferreteria-pgdata:
